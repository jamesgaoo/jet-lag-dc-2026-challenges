<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jet Lag DC 2026 — Challenge Cards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 1.25rem;
  }

  .controls {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background 0.15s, transform 0.1s;
  }

  button:active { transform: scale(0.97); }

  .btn-primary {
    background: #2563eb;
    color: #fff;
    padding: 0.6rem 1.4rem;
  }
  .btn-primary:hover { background: #1d4ed8; }

  .btn-secondary {
    background: #e5e7eb;
    color: #374151;
    padding: 0.6rem 1.4rem;
  }
  .btn-secondary:hover { background: #d1d5db; }

  .deck-info {
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 1.25rem;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    width: 100%;
    max-width: 560px;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 1.25rem 1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 160px;
    opacity: 1;
    transition: opacity 0.3s ease;
  }

  .card.fade-out { opacity: 0; }
  .card.fade-in  { animation: fadeIn 0.35s ease forwards; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-text {
    font-size: 0.95rem;
    line-height: 1.4;
    flex: 1;
    display: flex;
    align-items: center;
  }

  .card .btn-done {
    align-self: flex-end;
    margin-top: 0.75rem;
    background: #10b981;
    color: #fff;
    padding: 0.4rem 1rem;
    font-size: 0.8rem;
    border-radius: 6px;
  }
  .card .btn-done:hover { background: #059669; }

  .card-text a {
    color: #2563eb;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-weight: 500;
  }
  .card-text a:hover {
    color: #1d4ed8;
  }

  .card-empty .card-text {
    color: #9ca3af;
    font-style: italic;
    justify-content: center;
    text-align: center;
  }

  @media (max-width: 400px) {
    .grid { gap: 0.75rem; }
    .card { padding: 1rem 0.75rem; min-height: 140px; }
  }
</style>
</head>
<body>

<h1>Challenge Cards</h1>
<p class="subtitle">Jet Lag DC 2026</p>

<div class="controls">
  <button class="btn-primary" id="startBtn">Start</button>
  <button class="btn-secondary" id="resetBtn">Reset / New Round</button>
</div>

<p class="deck-info" id="deckInfo"></p>

<div class="grid" id="grid"></div>

<script>
const HAND_SIZE = 4;
let allCards = [];
let deck = [];
let hand = []; // array of 4 items: string or null

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function draw() {
  return deck.length > 0 ? deck.pop() : null;
}

function updateDeckInfo() {
  document.getElementById('deckInfo').textContent =
    `Cards remaining in deck: ${deck.length} / ${allCards.length}`;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  hand.forEach((text, i) => {
    const card = document.createElement('div');
    card.className = 'card fade-in';
    if (text === null) {
      card.classList.add('card-empty');
      card.innerHTML = `<span class="card-text">No more cards!</span>`;
    } else {
      card.innerHTML = `
        <span class="card-text">${sanitizeCardHtml(text)}</span>
        <button class="btn-done" data-index="${i}">Done ✓</button>`;
    }
    grid.appendChild(card);
  });
  updateDeckInfo();
}

function replaceCard(index) {
  const grid = document.getElementById('grid');
  const cardEl = grid.children[index];
  if (!cardEl) return;

  cardEl.classList.add('fade-out');
  setTimeout(() => {
    hand[index] = draw();
    // rebuild just this slot
    const newCard = document.createElement('div');
    newCard.className = 'card fade-in';
    if (hand[index] === null) {
      newCard.classList.add('card-empty');
      newCard.innerHTML = `<span class="card-text">No more cards!</span>`;
    } else {
      newCard.innerHTML = `
        <span class="card-text">${sanitizeCardHtml(hand[index])}</span>
        <button class="btn-done" data-index="${index}">Done ✓</button>`;
    }
    grid.replaceChild(newCard, cardEl);
    updateDeckInfo();
  }, 300);
}

function startGame() {
  deck = shuffle([...allCards]);
  hand = [];
  for (let i = 0; i < HAND_SIZE; i++) hand.push(draw());
  renderGrid();
}

function sanitizeCardHtml(str) {
  // Allow only <a> tags with href; escape everything else
  const d = document.createElement('div');
  d.innerHTML = str;
  // Walk all elements and remove anything that isn't an <a>
  d.querySelectorAll('*').forEach(el => {
    if (el.tagName !== 'A') {
      el.replaceWith(document.createTextNode(el.textContent));
      return;
    }
    // Keep only href, force target="_blank" and rel for safety
    const href = el.getAttribute('href');
    Array.from(el.attributes).forEach(a => el.removeAttribute(a.name));
    if (href) el.setAttribute('href', href);
    el.setAttribute('target', '_blank');
    el.setAttribute('rel', 'noopener noreferrer');
  });
  return d.innerHTML;
}

// Event delegation for Done buttons
document.getElementById('grid').addEventListener('click', (e) => {
  if (e.target.classList.contains('btn-done')) {
    const index = parseInt(e.target.dataset.index, 10);
    replaceCard(index);
  }
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resetBtn').addEventListener('click', startGame);

// Load cards on page load
fetch('cards.csv')
  .then(r => r.text())
  .then(text => {
    allCards = text.split('\n').map(l => l.trim()).filter(Boolean);
    startGame();
  })
  .catch(err => {
    document.getElementById('deckInfo').textContent = 'Failed to load cards.csv';
    console.error(err);
  });
</script>

</body>
</html>
